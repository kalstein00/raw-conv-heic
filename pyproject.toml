[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rawhdr-poc"
version = "0.1.0"
description = "Windows ARW to independently verified gain-map HEIC proof of concept"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4", "rawpy==0.27.1", "imageio-ffmpeg==0.6.0", "Pillow==13.0.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "mypy==2.4.0", "cmake==3.31.10", "ninja==1.13.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["real_raw: requires a locally supplied private ARW and native codec build"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
